name: Validate datasets

on:
  push:
    branches: [master]
    paths:
      - "*.csv"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "*.csv"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CSV structure and vocabularies
        run: python scripts/validate.py
