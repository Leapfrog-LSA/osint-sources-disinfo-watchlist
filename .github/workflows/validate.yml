name: Validate datasets

on:
  push:
    branches: [master]
    paths:
      - "*.csv"
      - "scripts/**.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "*.csv"
      - "scripts/**.py"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate CSV structure and vocabularies
        run: python scripts/validate.py

      # The link checker decides what gets proposed for removal from the
      # catalogue, so a regression in it costs live sources — as it did in
      # v0.5.0. These tests make no network requests.
      - name: Run script tests
        run: python -m unittest discover -s scripts -p "test_*.py" --verbose
